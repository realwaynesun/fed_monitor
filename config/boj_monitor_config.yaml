# boj_monitor_config.yaml
# BOJ (Bank of Japan) Monetary Policy & Liquidity Monitoring System
# Simplified version using FRED data sources only for reliability
# Version: 2.0
# Last updated: 2026-01-25

version: "2.0"
last_updated: "2026-01-25"
timezone: "Asia/Tokyo"

# ============================================================================
# DATA SOURCES
# ============================================================================
data_sources:
  # FRED for Japan macro data (reliable, no Excel parsing needed)
  fred:
    base_url: "https://api.stlouisfed.org/fred"
    file_type: "json"
    api_key_env: "FRED_API_KEY"
    rate_limit:
      requests_per_minute: 100
      retry_delay_seconds: 5

# ============================================================================
# NOTIFICATIONS (disabled for BOJ - data only view)
# ============================================================================
notifications:
  telegram:
    enabled: false
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    chat_id_env: "TELEGRAM_CHAT_ID"
    parse_mode: "markdown"

# ============================================================================
# SERIES DEFINITIONS (FRED-sourced only)
# ============================================================================
series:
  # --------------------------------------------------------------------------
  # JGB YIELDS (国債利回り) - from FRED
  # --------------------------------------------------------------------------
  - key: jgb_10y
    series_id: "IRLTLT01JPM156N"
    source: fred
    label: "10年国債利回り"
    label_en: "10-Year JGB Yield"
    frequency: "monthly"
    unit: "percent"
    description: "10年物日本国債利回り"

  - key: jgb_3m
    series_id: "IR3TIB01JPM156N"
    source: fred
    label: "3ヶ月銀行間金利"
    label_en: "3-Month Interbank Rate"
    frequency: "monthly"
    unit: "percent"
    description: "3ヶ月銀行間金利（短期金利参照）"

  # --------------------------------------------------------------------------
  # BOJ BALANCE SHEET (日銀バランスシート) - from FRED
  # --------------------------------------------------------------------------
  - key: boj_total_assets
    series_id: "JPNASSETS"
    source: fred
    label: "日銀総資産"
    label_en: "BOJ Total Assets"
    frequency: "monthly"
    unit: "jpy_100millions"
    description: "日本銀行の総資産"

  # --------------------------------------------------------------------------
  # EXCHANGE RATE (為替レート) - from FRED
  # --------------------------------------------------------------------------
  - key: usdjpy
    series_id: "DEXJPUS"
    source: fred
    label: "ドル円レート"
    label_en: "USD/JPY Exchange Rate"
    frequency: "daily"
    unit: "jpy_per_usd"
    description: "ドル円為替レート"

  # --------------------------------------------------------------------------
  # MACRO INDICATORS (マクロ指標) - from FRED
  # --------------------------------------------------------------------------
  - key: jpn_cpi
    series_id: "JPNCPIALLMINMEI"
    source: fred
    label: "日本CPI"
    label_en: "Japan CPI"
    frequency: "monthly"
    unit: "index"
    description: "日本消費者物価指数"

  - key: jpn_m2
    series_id: "MYAGM2JPM189S"
    source: fred
    label: "日本M2"
    label_en: "Japan M2 Money Supply"
    frequency: "monthly"
    unit: "percent"
    description: "日本M2マネーサプライ前年比"

# ============================================================================
# DERIVED METRICS
# ============================================================================
derived:
  # --------------------------------------------------------------------------
  # Yield Curve (イールドカーブ)
  # --------------------------------------------------------------------------
  - key: curve_10y3m
    label: "10年-3ヶ月カーブ"
    label_en: "10Y-3M JGB Curve"
    unit: "bps"
    expr: "(jgb_10y - jgb_3m) * 100"
    description: "国債イールドカーブ（10年-3ヶ月）"

# ============================================================================
# METRICS CALCULATION
# ============================================================================
metrics:
  changes:
    - name: "d1"
      type: "diff"
      periods: 1
      description: "1日変化"
    - name: "d5"
      type: "diff"
      periods: 5
      description: "5日変化"
    - name: "d20"
      type: "diff"
      periods: 20
      description: "20日変化"

  rolling:
    - name: "ma5"
      type: "rolling_mean"
      window: 5
      description: "5日移動平均"
    - name: "ma20"
      type: "rolling_mean"
      window: 20
      description: "20日移動平均"
    - name: "zscore20"
      type: "zscore"
      window: 20
      description: "20日Zスコア"
    - name: "zscore60"
      type: "zscore"
      window: 60
      description: "60日Zスコア"

# ============================================================================
# ALERT RULES (minimal - data view only)
# ============================================================================
alerts:
  # JGB Yield monitoring
  - key: jgb_10y
    rule: "value > 1.5"
    severity: "warning"
    note: "10年国債利回りが1.5%超"
    category: "yields"

  - key: jgb_10y
    rule: "value > 2.0"
    severity: "critical"
    note: "10年国債利回りが2.0%超"
    category: "yields"

  # FX monitoring
  - key: usdjpy
    rule: "value > 160"
    severity: "warning"
    note: "ドル円が160円超 - 円安警戒水準"
    category: "fx"

  - key: usdjpy
    rule: "value > 170"
    severity: "critical"
    note: "ドル円が170円超 - 極端な円安"
    category: "fx"

# ============================================================================
# DASHBOARD PANEL CONFIGURATION
# ============================================================================
panel:
  refresh_interval_seconds: 300

  charts:
    - title: "10年国債利回り / 10-Year JGB Yield"
      series: ["jgb_10y"]
      chart_type: "line"
      y_axis_label: "利回り (%)"
      height: 350

    - title: "短期金利 / Short-Term Rate"
      series: ["jgb_3m"]
      chart_type: "line"
      y_axis_label: "金利 (%)"
      height: 320

    - title: "イールドカーブ / Yield Curve Spread"
      series: ["curve_10y3m"]
      chart_type: "line"
      y_axis_label: "スプレッド (bps)"
      reference_line: 0
      height: 320

    - title: "日銀総資産 / BOJ Total Assets"
      series: ["boj_total_assets"]
      chart_type: "line"
      y_axis_label: "億円"
      height: 350

    - title: "ドル円 / USD/JPY"
      series: ["usdjpy"]
      chart_type: "line"
      y_axis_label: "円/ドル"
      height: 320

    - title: "日本CPI / Japan CPI"
      series: ["jpn_cpi"]
      chart_type: "line"
      y_axis_label: "指数"
      height: 280

  tables:
    - title: "金利 / Interest Rates"
      series: ["jgb_10y", "jgb_3m", "curve_10y3m"]
      show_columns: ["value", "d1", "d5", "zscore20"]

    - title: "バランスシート・為替 / Balance Sheet & FX"
      series: ["boj_total_assets", "usdjpy", "jpn_cpi", "jpn_m2"]
      show_columns: ["value", "d5", "d20", "zscore60"]

# ============================================================================
# DATABASE
# ============================================================================
database:
  type: "sqlite"
  path: "fed_monitor.db"  # Use same DB as Fed Monitor
